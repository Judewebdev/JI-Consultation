[build]
  # Static site, nothing to compile.
  # publish = "site" keeps node_modules and repo tooling out of the deploy.
  publish = "site"
  command = ""

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: the router owns /agency/*, /academy/* and everything else,
# so every path must serve index.html with a 200 (not a 301, or deep links break).
# Keep this LAST among redirects so real files still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Assets are content-stable, so cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must revalidate so edits go live immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
