# Local Postgres for development.
#
#   docker compose up -d
#   npm run setup
#
# Same engine as production, so nothing behaves differently between the two.
# Data lives in a named volume; `docker compose down -v` wipes it.

services:
  postgres:
    image: postgres:17-alpine
    container_name: jiga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: academy
    ports:
      - "5432:5432"
    volumes:
      - jiga-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jiga-pgdata:
